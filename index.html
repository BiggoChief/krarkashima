<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
:root{
  /* Layout: a one-hand phone column (board tiles, turn counters, coin tray) with the cast/flip dock pinned under the thumb */
  --bg:#E8ECF2; --surface:#FFFFFF; --sunk:#DCE2EB; --ink:#121A2C; --ink-2:#4A5672; --line:#C7CFDC;
  --copper:#A4531A; --copper-ink:#FFFFFF; --copper-soft:#F4E6D8;
  --red:#C43520; --blue:#1E5CC4; --grey:#767F93;
  --win:#C18B1F; --win-hi:#F6D879; --win-ink:#3A2700;
  --loss:#556079; --loss-hi:#A3ADC4; --loss-ink:#FFFFFF;
  --scrim:rgba(12,17,30,.48);
  --shadow:0 1px 0 rgba(18,26,44,.05),0 8px 22px -14px rgba(18,26,44,.45);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#161D2E; --sunk:#0F1626; --ink:#E6EAF2; --ink-2:#98A3BC; --line:#28324B;
    --copper:#E38D45; --copper-ink:#1B0E03; --copper-soft:#33231A;
    --red:#FF6C55; --blue:#6EA4FF; --grey:#8A94A9;
    --win:#D9A53A; --win-hi:#FFE38F; --win-ink:#2E1F00;
    --loss:#4D5772; --loss-hi:#8690A8; --loss-ink:#F3F5FA;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D2E; --sunk:#0F1626; --ink:#E6EAF2; --ink-2:#98A3BC; --line:#28324B;
  --copper:#E38D45; --copper-ink:#1B0E03; --copper-soft:#33231A;
  --red:#FF6C55; --blue:#6EA4FF; --grey:#8A94A9;
  --win:#D9A53A; --win-hi:#FFE38F; --win-ink:#2E1F00;
  --loss:#4D5772; --loss-hi:#8690A8; --loss-ink:#F3F5FA;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.38;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
h2,h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--ink-2)}
p{margin:0}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;margin-inline:-16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto;min-width:0}
.brand-mark{width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--win-hi),var(--win) 70%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--sunk)}

.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs button{padding:6px 14px;font-family:var(--f-display);font-size:16px;letter-spacing:.03em}

.block{padding-block:14px 4px;display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;align-items:center;gap:8px;min-height:26px}
.block-head h2{margin-right:auto}
.hint{font-size:12px;color:var(--ink-2)}
.text-btn{font-size:14px;font-weight:600;color:var(--copper);padding:4px 2px}
.chip-btn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--copper-soft);color:var(--copper)}

/* Board */
.eng-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.eng{position:relative}
.eng-hit{width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.eng-hit:active{transform:scale(.97)}
.eng.on .eng-hit{border-color:var(--copper);background:var(--copper-soft)}
.eng-n{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.eng.on .eng-n{color:var(--copper)}
.eng-l{font-size:11px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eng-minus{position:absolute;top:-6px;right:-5px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;line-height:1;color:var(--ink-2);box-shadow:var(--shadow)}
.per-cast{font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.5}
.per-cast .lbl{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:var(--ink-2);margin-right:4px}
.sep{color:var(--line);margin:0 6px}

/* Turn counters */
.ctr-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ctr-l{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.ctr-l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ctr-v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.ctr-v.bump{animation:bump .4s ease-out}
@keyframes bump{0%{transform:scale(1.25);color:var(--copper)}100%{transform:none}}
.ctr-b{display:flex;gap:4px;width:100%}
.ctr-b button{flex:1;height:30px;border-radius:7px;background:var(--sunk);font-size:18px;font-weight:600;line-height:1}
.ctr-b button:active{background:var(--line)}

/* Mana pips */
.pip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:700 11px/1 var(--f-display);font-style:normal;color:#fff;background:var(--grey);vertical-align:middle}
.pip+.pip{margin-left:2px}
.pip.R{background:var(--red)}
.pip.U{background:var(--blue)}
.pip.UR{background:linear-gradient(135deg,var(--blue) 50%,var(--red) 50%)}
.pip.phy{box-shadow:inset 0 0 0 2px var(--surface);outline:1.5px dashed currentColor;outline-offset:-1px}

/* Coins */
.coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--f-display);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.22)}
.coin.W{background:radial-gradient(circle at 35% 30%,var(--win-hi),var(--win) 72%);color:var(--win-ink)}
.coin.L{background:radial-gradient(circle at 35% 30%,var(--loss-hi),var(--loss) 72%);color:var(--loss-ink)}
.coin.big{width:76px;height:76px;font-size:30px}
.coin.idle{opacity:.85}
.coin.anim{animation:flipIn .38s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0)*55ms)}
.coin.big.anim{animation:spin .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes flipIn{from{transform:rotateY(90deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{from{transform:rotateY(900deg) scale(.7)}to{transform:none}}
.cw{display:flex;flex-direction:column;align-items:center;gap:3px}
.ign{display:flex;gap:2px}
.ign i{width:7px;height:7px;border-radius:50%;opacity:.6}
.ign i.W{background:var(--win)}
.ign i.L{background:var(--loss)}
.coin-row{display:flex;flex-wrap:wrap;gap:6px}

/* Tray */
.tray-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.g-head{display:flex;align-items:flex-start;gap:10px}
.g-title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.g-meta{font-size:12.5px;color:var(--ink-2)}
.g-flip{display:flex;align-items:center;gap:14px}
.status{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-weight:600;font-size:15px;padding:5px 10px;border-radius:8px;background:var(--sunk)}
.status.back{background:var(--copper-soft);color:var(--copper)}
.status.gy{background:var(--red);color:var(--surface)}
.status.gy::before{content:'!';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface);color:var(--red);font:700 13px/1 var(--f-display)}
.tally-head{grid-column:1 / -1;font-size:11.5px;font-weight:600;color:var(--ink-2);padding-top:4px}
.ctr.auto{background:var(--sunk);border-style:dashed;padding-block:8px}
.ctr.wide{grid-column:span 2}
.status.win2{background:var(--win);color:var(--win-ink)}
.cap{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;color:var(--ink-2);margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%}
.notes{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ask-box{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.ask-q{font-size:14.5px;font-weight:500}
.ask-coins{display:flex;gap:8px;align-items:center}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;padding:8px 12px;border-radius:10px;background:var(--sunk);font-weight:600;font-size:15px}
.btn.win{background:var(--win);color:var(--win-ink)}
.btn.loss{background:var(--loss);color:var(--loss-ink)}
.btn.primary{background:var(--copper);color:var(--copper-ink)}
.btn.danger{color:var(--red)}
.num-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.num-row .btn{min-height:44px;padding:0;font-family:var(--f-display);font-size:20px}
.waiting{font-size:13px;color:var(--ink-2)}
.older{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.older p{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.older b{color:var(--ink);font-weight:600}
.empty{display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:14px}
.hist{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.hist i{width:9px;height:9px;border-radius:50%}
.hist i.W{background:var(--win)}
.hist i.L{background:var(--loss)}

/* Log */
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.log li{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink);overflow-wrap:anywhere}
.log li.turn{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);font-size:12px}
.log-empty{font-size:13px;color:var(--ink-2)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:52px 1fr 1fr 1.5fr;gap:8px}
.d-btn{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em;background:var(--sunk);min-width:0}
.d-btn:active{transform:scale(.97)}
.d-undo{font-size:11px;font-family:var(--f-body);font-weight:600;color:var(--ink-2)}
.d-flip{flex-direction:row;gap:8px}
.mini-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--win-hi),var(--win) 72%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.d-cast{background:var(--ink);color:var(--bg)}
.d-recast{background:var(--copper);color:var(--copper-ink);padding-inline:8px}
.d-recast.warn{background:var(--surface);color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.d-recast.armed{background:var(--red);color:var(--surface);box-shadow:none;animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.d-top{line-height:1}
.d-sub{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head .g-title{font-size:22px}
.sheet-tools{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 16px;flex:1}
.search{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.pay-note{font-size:12px;color:var(--ink-2)}
.list-h{position:sticky;top:-4px;background:var(--surface);padding:12px 0 6px;z-index:1}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.row-main{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:2px;padding:10px 2px;text-align:left;min-width:0}
.row-main:active,.row-alt:active{background:var(--sunk)}
.row-name{font-weight:600;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.row-tags{grid-column:1;font-size:12px;color:var(--ink-2)}
.row-cost{grid-row:1 / span 2;grid-column:2;white-space:nowrap}
.row-alt{flex:none;width:96px;font-size:12px;font-weight:600;color:var(--copper);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tag-storm{color:var(--copper);font-weight:600}
.ask-inline{display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0 10px;border-radius:10px;background:var(--copper-soft);flex-wrap:wrap}
.ask-inline span{flex:1 1 140px;font-size:13.5px}
.set-row{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-bottom:1px solid var(--line)}
.desc{font-size:13px;color:var(--ink-2)}

/* Steppers */
.stp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.stp-l{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.stp-c{display:flex;align-items:center;gap:6px}
.stp-c button{width:36px;height:34px;border-radius:8px;background:var(--sunk);font-size:18px;font-weight:600}
.stp-c output{flex:1;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}

/* Odds */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2);font-weight:500}
.stat.hero b{color:var(--copper)}
.chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px 8px}
.chart-wrap svg{display:block;width:100%;height:auto}
.ch-back{fill:var(--copper)}
.ch-res{fill:var(--loss-hi)}
.ch-t{fill:var(--ink-2);font:500 10px var(--f-body)}
.ch-axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding:4px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dl{display:grid;grid-template-columns:1fr auto;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.dl dt,.dl dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:17px}
.dl dt:nth-last-of-type(1),.dl dd:nth-last-of-type(1){border-bottom:0}
.dl dd.neg{color:var(--red)}
.dl dd.total{color:var(--copper);font-size:20px}
.select{width:100%;font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.callout{font-size:13px;color:var(--ink-2);padding:8px 10px;border-left:3px solid var(--copper);background:var(--surface);border-radius:0 8px 8px 0}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
details.rules summary{cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--ink-2)}
details.rules ul{margin:10px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}

@media (prefers-reduced-motion: reduce){
  .coin.anim,.coin.big.anim,.ctr-v.bump,.sheet,.d-recast.armed{animation:none}
}
@media (max-width:360px){
  .eng-l{font-size:10px}
  .ctr-v{font-size:26px}
  .dock-in{grid-template-columns:46px 1fr 1fr 1.4fr;gap:6px}
}

/* Tablet and desktop: two columns. The phone layout above is untouched below 760px. */
@media (min-width:760px){
  .wrap{max-width:1240px;padding-inline:24px;padding-block:0 32px}
  header.top{margin-inline:-24px;padding-inline:24px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .col{min-width:0}
  .col-right{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);max-height:calc(100vh - 60px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px;scrollbar-width:thin}
  .dock{position:sticky;top:0;z-index:5;padding:14px 0 4px;background:var(--bg);border-top:0}
  .dock-in{max-width:none;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
  .d-btn{height:58px}
  .sheet{max-width:640px}
  .chart-wrap svg{max-height:240px}
}
@media (min-width:1100px){
  .split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px}
  .eng-l{font-size:12px}
  .eng-n{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Krarkashima</span></div>
    <nav class="seg tabs" aria-label="Screens">
      <button id="tab-play" data-a="tab" data-tab="play">Play</button>
      <button id="tab-odds" data-a="tab" data-tab="odds">Odds</button>
    </nav>
    <button class="icon-btn" data-a="settings-open" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    </button>
  </header>

  <!-- Phone: one column with the dock fixed to the bottom. 760px and wider: board and turn on the left,
       dock, coins and log in a sticky right column. -->
  <main id="screen-play" class="split">
    <div class="col col-left">
      <section class="block" id="board" aria-label="Board"></section>
      <section class="block" id="turn" aria-label="This turn"></section>
    </div>
    <div class="col col-right">
      <nav class="dock" id="dock" aria-label="Actions">
        <div class="dock-in">
          <button id="dock-undo" class="d-btn d-undo" data-a="undo" aria-label="Undo last action">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            Undo
          </button>
          <button class="d-btn d-flip" data-a="flip"><span class="mini-coin" aria-hidden="true"></span>Flip</button>
          <button class="d-btn d-cast" data-a="cast-open">Cast…</button>
          <button id="dock-recast" class="d-btn d-recast" data-a="recast"><span class="d-top">Recast</span><span id="dock-recast-name" class="d-sub">nothing yet</span></button>
        </div>
      </nav>
      <section class="block" id="tray" aria-label="Coins" aria-live="polite"></section>
      <section class="block" id="log" aria-label="Log"></section>
    </div>
  </main>
  <main id="screen-odds" class="split" hidden></main>
</div>

<div class="scrim" id="scrim" data-a="sheet-close" hidden></div>

<section class="sheet" id="sheet-cast" role="dialog" aria-modal="true" aria-labelledby="cast-title" hidden>
  <div class="sheet-head">
    <span class="g-title" id="cast-title">Cast a spell</span>
    <button class="text-btn" data-a="sheet-close">Close</button>
  </div>
  <div class="sheet-tools">
    <div class="seg" id="pay-seg" role="group" aria-label="How to pay"></div>
    <p class="pay-note" id="pay-note"></p>
    <input class="search" id="cast-q" type="search" placeholder="Find a card" autocomplete="off" aria-label="Find a card">
  </div>
  <div class="sheet-body" id="cast-list"></div>
</section>

<section class="sheet" id="sheet-settings" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="sheet-head">
    <span class="g-title" id="set-title">Settings</span>
    <button class="text-btn" data-a="sheet-close">Done</button>
  </div>
  <div class="sheet-body" id="settings-body"></div>
</section>

<script>
'use strict';

/* =====================================================================
   DECK LIST: edit this block when the deck changes.
   t: I instant · S sorcery · C creature · A artifact · E enchantment · L land
   c: mana cost in Scryfall {} notation. q: copies (basics only).
   Per-resolution effects (original + every copy):
     R red mana · T Treasures · dmg damage to any targets · each damage to each opponent
     mill · untap (lands) · poison · flip (coin flip, Stitch in Time) · ask:'jeska'
     draw · discard · top (cards put back) · drawAlt (draw when not cast from hand)
   storm:true makes storm copies on cast. fb is a flashback cost; fbDiscard a discard paid with it.
   note: shown under the result. aka: the card's other printed name.
   ===================================================================== */
const COMMANDERS = [
  { n:'Krark, the Thumbless', c:'{1}{R}', t:'C' },
  { n:'Sakashima of a Thousand Faces', c:'{3}{U}', t:'C', note:'Copying Krark or another engine? Tap it on the board' },
];
const DECK = [
  // Instants
  { n:"An Offer You Can't Refuse", c:'{U}', t:'I', note:"Each resolution counters a noncreature spell, and that spell's controller makes 2 Treasures" },
  { n:'Borne Upon a Wind', c:'{1}{U}', t:'I', draw:1 },
  { n:'Brain Freeze', c:'{1}{U}', t:'I', storm:true, mill:3 },
  { n:'Brainstorm', c:'{U}', t:'I', draw:3, top:2 },
  { n:'Consider', c:'{U}', t:'I', draw:1 },
  { n:'Counterspell', c:'{U}{U}', t:'I' },
  { n:'Crimson Wisps', c:'{R}', t:'I', draw:1 },
  { n:'Desperate Ritual', c:'{1}{R}', t:'I', R:3 },
  { n:'Flashback', c:'{R}', t:'I' },
  { n:'Flusterstorm', c:'{U}', t:'I', storm:true },
  { n:'Frantic Search', c:'{2}{U}', t:'I', untap:3, draw:2, discard:2 },
  { n:'Gut Shot', c:'{R/P}', t:'I', dmg:1 },
  { n:'Lightning Bolt', c:'{R}', t:'I', dmg:3 },
  { n:'Mana Leak', c:'{1}{U}', t:'I' },
  { n:'Might of the Meek', c:'{R}', t:'I', draw:1 },
  { n:'Mogg Salvage', c:'{2}{R}', t:'I', note:'Free if an opponent controls an Island and you control a Mountain' },
  { n:'Mystical Tutor', c:'{U}', t:'I' },
  { n:'Negate', c:'{1}{U}', t:'I' },
  { n:'Opt', c:'{U}', t:'I', draw:1 },
  { n:'Peek', c:'{U}', t:'I', draw:1 },
  { n:'Prologue to Phyresis', c:'{1}{U}', t:'I', poison:1, draw:1 },
  { n:'Pyretic Ritual', c:'{1}{R}', t:'I', R:3 },

/* =====================================================================
   ENGINES: permanents the tracker automates. A tile shows only when its
   card is in the list above. The rules for each id live in cast(),
   magecraft() and record() below.
   Trigger multiplier = 1 + Veyran + Harmonic Prodigy for Krark (Goblin Wizard),
   Storm-Kiln Artist and Ashling (Shamans). Birgi and Electro get Veyran only.
   ===================================================================== */
const ENGINES = [
  { id:'krark',     card:'Krark, the Thumbless',        short:'Krark',     tip:'Krark, Sakashima and any copies' },
  { id:'thumb',     card:"Krark's Thumb",               short:'Thumb',     tip:'Each Thumb doubles the coins you choose from' },
  { id:'veyran',    card:'Veyran, Voice of Duality',     short:'Veyran',    tip:'Cast and copy triggers fire once more' },
  { id:'prodigy',   card:'Harmonic Prodigy',             short:'Prodigy',   tip:'Wizard and Shaman triggers fire once more' },
  { id:'birgi',     card:'Birgi, God of Storytelling',   short:'Birgi',     tip:'+R whenever you cast a spell' },
  { id:'electro',   card:'Electro, Assaulting Battery',  short:'Electro',   tip:'+R per instant or sorcery cast' },
  { id:'kiln',      card:'Storm-Kiln Artist',            short:'Kiln',      tip:'Treasure per instant/sorcery cast or copy' },
  { id:'scoundrel', card:'Tavern Scoundrel',             short:'Tavern',    tip:'2 Treasures per coin flip you win' },
  { id:'ashling',   card:'Ashling, Flame Dancer',        short:'Ashling',   tip:'2nd trigger each turn: 2 damage · 3rd: RRRR' },
  { id:'geist',     card:'Geist of Saint Thalia',        short:'Geist',     tip:'Noncreature spells cost 1 less' },
  { id:'muse',      card:'Muse Seeker',                  short:'Muse',      tip:'Draw per instant/sorcery cast, then discard unless 5+ mana spent' },
];

const POLICY = {
  first:  { short:'Return first', long:'Take a loss at the first split where you still need one, then keep wins. Best chance to get the spell back and keep looping.' },
  last:   { short:'Return last',  long:'Keep wins on every split and take a loss only on the final trigger if you still need one. More copies, more risk of losing the card.' },
  copies: { short:'Copies only',  long:'Always keep wins. Use it on a finisher you don\'t need back.' },
};

/* ---------- Card lookup ---------- */
const ALL = [...COMMANDERS.map(c => ({ ...c, cmd:true })), ...DECK];
const CARD = Object.fromEntries(ALL.map(c => [c.n, c]));
const GENERIC = {
  'Other instant': { n:'Other instant', c:'', t:'I', generic:true },
  'Other sorcery': { n:'Other sorcery', c:'', t:'S', generic:true },
  'Other spell':   { n:'Other spell',   c:'', t:'C', generic:true },
};
const getCard = name => CARD[name] || GENERIC[name] || { n:name, c:'', t:'I', generic:true };
const isIS = c => c.t === 'I' || c.t === 'S';
const ENG_BY_CARD = Object.fromEntries(ENGINES.map(e => [e.card, e]));
const SHOWN_ENGINES = ENGINES.filter(e => CARD[e.card]);

function parseCost(cost) {
  let gen = 0; const pips = [];
  for (const m of (cost || '').matchAll(/\{([^}]+)\}/g)) {
    const t = m[1];
    if (/^\d+$/.test(t)) gen += Number(t); else if (t !== 'X') pips.push(t);
  }
  return { gen, pips };
}
const mv = cost => { const p = parseCost(cost); return p.gen + p.pips.length; };

/* ---------- State ---------- */
const KEY = 'krarkashima-calculator-v1';
function freshGame() {
  return { eng:{ krark:1 }, storm:0, copies:0, R:0, U:0, C:0, T:0, life:40, ash:0, extra:0, turn:1,
           dmg:0, each:0, mill:0, poison:0, draw:0, discard:0,
           stack:[], recent:[], lastSpell:null, flips:[], log:[], seq:0 };
}
// Fills in fields added in later versions so older saves and undo steps still load.
const migrate = g => Object.assign(freshGame(), g || {});
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
let G = migrate(saved && saved.game);
const SET = Object.assign({ coins:'virtual', choose:'auto', policy:'first', pay:'pool+t', awake:'on' }, saved && saved.settings);
const ODDS = Object.assign({ K:2, T:1, V:0, P:0, policy:'first', spell:'Brainstorm', cost:1, mana:0, B:1, E:0, S:1, Sc:0, G:0 }, saved && saved.odds);
let UNDO = (saved && Array.isArray(saved.undo)) ? saved.undo : [];
let TAB = (saved && saved.tab) || 'play';
const SHEET = { open:null, q:'', ask:null, x:7 };
const FRESH = new Set();
let CONFIRM_NEW = false, confirmTimer = null;
let ARM_RECAST = false, recastTimer = null;
let LASTVALS = {};

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ game:G, settings:SET, odds:ODDS, undo:UNDO.slice(-25), tab:TAB })); } catch (e) {}
}
function checkpoint() { UNDO.push(JSON.stringify(G)); if (UNDO.length > 120) UNDO.shift(); }
function log(text) { G.log.unshift({ turn:G.turn, text }); if (G.log.length > 80) G.log.length = 80; }

/* ---------- Game rules ---------- */
const cnt = id => G.eng[id] || 0;
const trig = () => 1 + cnt('veyran') + cnt('prodigy');
const topGroup = () => G.stack[G.stack.length - 1];
function add(g, k, v) { if (!v) return; G[k] += v; g.gain[k] = (g.gain[k] || 0) + v; }

function coinFace() {
  try { const a = new Uint8Array(1); crypto.getRandomValues(a); return (a[0] & 1) ? 'W' : 'L'; }
  catch (e) { return Math.random() < 0.5 ? 'W' : 'L'; }
}
function flipSet() { const k = Math.pow(2, cnt('thumb')); const out = []; for (let i = 0; i < k; i++) out.push(coinFace()); return out; }

function newGroup(kind, name, n, extra) {
  return Object.assign({ id:++G.seq, kind, name, n, res:[], gain:{}, notes:[], loot:0, sc:0, pending:null }, extra || {});
}

// Magecraft: Storm-Kiln Artist and Ashling trigger on each cast or copy of an instant or sorcery.
function magecraft(g, times) {
  if (!times) return;
  const m = trig();
  add(g, 'T', cnt('kiln') * m * times);
  const a = cnt('ashling');
  if (a) {
    const before = G.ash; G.ash += m * times;
    add(g, 'discard', a * m * times); add(g, 'draw', a * m * times);   // each trigger: discard a card, then draw a card
    if (before < 2 && G.ash >= 2) { add(g, 'each', 2 * a); g.notes.push(`Ashling's 2nd trigger: 2 damage to each opponent and each creature they control${a > 1 ? ` (×${a})` : ''}`); }
    if (before < 3 && G.ash >= 3) { add(g, 'R', 4 * a); g.notes.push(`Ashling's 3rd trigger this turn: +${4 * a} R`); }
  }
}

function pay(card, cost) {
  if (!cost) return '';
  let { gen, pips } = parseCost(cost);
  // Phyrexian mana is always paid with 2 life, in every payment mode, never with mana.
  const life = 2 * pips.filter(p => p.endsWith('/P')).length;
  G.life -= life;
  pips = pips.filter(p => !p.endsWith('/P'));
  if (SET.pay === 'none') return life ? `Paid ${life} life` : '';
  if (!card.generic && card.t !== 'C' && cnt('geist')) gen = Math.max(0, gen - cnt('geist'));
  const used = { R:0, U:0, C:0, T:0 }; let lands = 0;
  const take = k => { if (G[k] > 0) { G[k]--; used[k]++; return true; } return false; };
  const treasure = () => SET.pay === 'pool+t' && take('T');
  for (const p of pips) {
    if (p.includes('/')) {
      const [a, b] = p.split('/'); const first = G[a] >= G[b] ? a : b; const second = first === a ? b : a;
      take(first) || take(second) || treasure() || lands++;
    }
    else if (p === 'R' || p === 'U' || p === 'C') { take(p) || treasure() || lands++; }
    else lands++;
  }
  for (let i = 0; i < gen; i++) { take('C') || take('R') || take('U') || treasure() || lands++; }
  const parts = [];
  if (used.R) parts.push(`${used.R} R`); if (used.U) parts.push(`${used.U} U`); if (used.C) parts.push(`${used.C} C`);
  if (used.T) parts.push(`${used.T} Treasure`); if (life) parts.push(`${life} life`);
  let s = parts.length ? 'Paid ' + parts.join(' + ') : '';
  if (lands) s += (s ? ' · ' : '') + `${lands} from lands`;
  return s;
}

function cast(name, opt) {
  opt = opt || {};
  const card = getCard(name);
  checkpoint();
  G.draw = 0; G.discard = 0;   // draw and discard count one cast at a time
  const IS = isIS(card);
  const g = newGroup('krark', card.n, IS ? cnt('krark') * trig() : 0, { IS, fb:!!opt.fb, x:opt.x || 0 });
  const cost = opt.fb ? card.fb : card.c;
  g.paid = pay(card, cost);
  if (opt.fb && card.fbDiscard) add(g, 'discard', card.fbDiscard);
  const stormBefore = G.storm; G.storm++;
  const v = cnt('veyran');
  add(g, 'R', cnt('birgi') * (IS ? 1 + v : 1));
  if (IS) add(g, 'R', cnt('electro') * (1 + v));
  if (IS) magecraft(g, 1);
  if (IS && cnt('muse')) {
    // Muse Seeker (Opus, a Wizard trigger): draw, then discard unless 5+ mana was spent.
    const times = cnt('muse') * trig();
    add(g, 'draw', times);
    if (mv(cost) - (card.generic ? 0 : cnt('geist')) < 5) add(g, 'discard', times);
  }
  if (IS && card.storm && stormBefore > 0) { g.sc = stormBefore; add(g, 'copies', stormBefore); magecraft(g, stormBefore); }
  // fate: where the card is now. Recast only skips the confirm tap when it's back in hand.
  G.lastSpell = { name:card.n, x:opt.x || 0, id:g.id, fate:'stack' };
  if (g.n > 0) G.stack.push(g); else finish(g);
  run(); render();
}

function copyLast() {
  if (!G.lastSpell) return;
  const card = getCard(G.lastSpell.name);
  if (!isIS(card)) return;
  checkpoint();
  G.draw = 0; G.discard = 0;
  const g = newGroup('copy', card.n, 0, { IS:true, x:G.lastSpell.x });
  add(g, 'copies', 1); magecraft(g, 1);
  finish(g); run(); render();
}

function flipNow() { checkpoint(); G.stack.push(newGroup('flip', 'Coin flip', 1)); run(); render(); }

// Phase 1 is Krark's triggers (res). Phase 2 is the spell's own coin flips, one per resolution (res2).
function record(g, k, coins) {
  (g.phase === 2 ? g.res2 : g.res).push({ k, c:coins || null });
  G.flips.push(k); if (G.flips.length > 300) G.flips.splice(0, G.flips.length - 300);
  if (k === 'W') add(g, 'T', 2 * cnt('scoundrel'));
}

function decide(g) {
  if (g.kind !== 'krark' || g.phase === 2) return 'W';
  if (g.fb) return 'W';   // a flashback spell is exiled whether it wins or loses, so a loss gains nothing
  const lost = g.res.some(r => r.k === 'L');
  if (lost || SET.policy === 'copies') return 'W';
  if (SET.policy === 'first') return 'L';
  return g.res.length === g.n - 1 ? 'L' : 'W';
}

// Resolve flips for one group. Returns true when the group is finished.
function advance(g, force) {
  if (SET.coins === 'real') return false;
  const p2 = g.phase === 2;
  const auto = force || p2 || SET.choose === 'auto' || g.kind !== 'krark';
  const list = p2 ? g.res2 : g.res, need = p2 ? g.n2 : g.n;
  while (list.length < need) {
    const cs = g.pending || flipSet(); g.pending = null;
    if (cs.every(x => x === cs[0])) { record(g, cs[0], cs); continue; }
    if (auto) { record(g, decide(g), cs); continue; }
    g.pending = cs; return false;
  }
  finish(g); return true;
}
function run(force) {
  let guard = 0;
  while (G.stack.length && guard < 200) {
    if (!advance(topGroup(), force && guard === 0)) break;
    guard++;
  }
}

function effects(g, card, total) {
  if (!total) return;
  if (card.R) add(g, 'R', card.R * total);
  if (card.T) add(g, 'T', card.T * total);
  if (card.ask === 'jeska') {
    if (g.x) add(g, 'R', g.x * total);
    g.notes.push(`Each resolution can also exile your top 3 cards to play this turn`);
  }
  if (card.dmg) {
    add(g, 'dmg', card.dmg * total);
    if (total > 1) g.notes.push(`${total} hits of ${card.dmg}, split among any targets`);
  }
  if (card.each) { add(g, 'each', card.each * total); g.notes.push(`Also hits each creature and planeswalker they control`); }
  if (card.mill) {
    add(g, 'mill', card.mill * total);
    if (total > 1) g.notes.push(`${total} mills of ${card.mill}, each can target any player`);
  }
  if (card.untap) g.notes.push(`Untap up to ${card.untap * total} lands`);
  if (card.poison) add(g, 'poison', card.poison * total);
  if (card.draw) {
    // drawAlt: Twinned Vision draws 2 when not cast from hand (every copy, or a flashback cast).
    const orig = g.kind === 'krark' && !g.back ? 1 : 0;
    const alt = card.drawAlt || card.draw;
    add(g, 'draw', (total - orig) * alt + orig * (g.fb ? alt : card.draw));
  }
  if (card.discard) add(g, 'discard', card.discard * total);
  if (card.top) g.notes.push(`Put ${card.top * total} cards back on top of your library`);
  if (card.note) g.notes.push(card.note);
  const e = ENG_BY_CARD[card.n];
  if (e) g.notes.push(`If it resolves, tap ${e.short} on the board`);
}

function finish(g) {
  const card = getCard(g.name);
  if (g.phase === 2) {
    g.w2 = g.res2.filter(r => r.k === 'W').length;
    add(g, 'extra', g.w2);
  } else {
    const w = g.res.filter(r => r.k === 'W').length, l = g.res.length - w;
    g.w = w; g.l = l;
    if (g.kind === 'krark' || g.kind === 'copy') {
      let total = 1;
      if (g.kind === 'krark') {
        if (w) { add(g, 'copies', w); magecraft(g, w); }
        g.back = l > 0;
        total = g.sc + w + (g.back ? 0 : 1);
      }
      g.total = total;
      effects(g, card, total);
      if (g.kind === 'krark') {
        g.fate = !g.IS ? 'battlefield' : g.fb ? 'exiled' : g.back ? 'hand' : 'graveyard';
        if (G.lastSpell && G.lastSpell.id === g.id) G.lastSpell.fate = g.fate;
      }
      // Stitch in Time: each resolution (every copy, plus the original if it resolved) flips once.
      // Those flips run on the same card after Krark's triggers; a win is an extra turn, a loss does nothing.
      if (card.flip && total > 0) {
        g.phase = 2; g.n2 = total; g.res2 = [];
        if (!G.stack.some(x => x.id === g.id)) G.stack.push(g);
        return;
      }
    } else if (g.kind === 'stitch') {
      add(g, 'extra', w);   // older saves only
    }
  }
  g.pending = null;
  G.stack = G.stack.filter(x => x.id !== g.id);
  G.recent.unshift(g); if (G.recent.length > 6) G.recent.length = 6;
  FRESH.add(g.id);
  log(summaryText(g));
}

function choose(k) {
  const g = topGroup(); if (!g || !g.pending) return;
  checkpoint();
  const cs = g.pending; g.pending = null;
  record(g, k, cs); run(); render();
}
function reportReal(w) {
  const g = topGroup(); if (!g) return;
  checkpoint();
  const rem = g.phase === 2 ? g.n2 - g.res2.length : g.n - g.res.length;
  for (let i = 0; i < rem; i++) record(g, i < w ? 'W' : 'L', null);
  finish(g); render();
}
function endTurn() {
  checkpoint();
  const keepRed = cnt('ashling') || cnt('electro');
  G.storm = 0; G.copies = 0; G.ash = 0; G.U = 0; G.C = 0; G.stack = [];
  G.dmg = 0; G.each = 0; G.mill = 0; G.draw = 0; G.discard = 0;   // poison counters stay for the whole game
  if (!keepRed) G.R = 0;
  let extra = false;
  if (G.extra > 0) { G.extra--; extra = true; }
  G.turn++;
  log(`Turn ${G.turn}${extra ? ' (extra turn)' : ''}${keepRed && G.R ? ` · ${G.R} red mana kept` : ''}`);
  G.log[0].isTurn = true;
  render();
}
function newGame() { checkpoint(); G = freshGame(); log('New game'); G.log[0].isTurn = true; render(); }

/* ---------- Text helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function pct(p) {
  if (p > 0 && p < 0.0005) return '<0.1%';
  if (p < 1 && p > 0.9995) return '>99.9%';
  return (Math.round(p * 1000) / 10) + '%';
}
const sign = v => (v > 0 ? '+' : '−') + Math.abs(v);
const plural = (n, a, b) => n === 1 ? a : b;

function pips(cost) {
  if (!cost) return '';
  return [...cost.matchAll(/\{([^}]+)\}/g)].map(m => {
    const t = m[1]; let cls = '', txt = t;
    if (t === 'R' || t === 'U') cls = t;
    else if (t.endsWith('/P')) { cls = t[0] + ' phy'; txt = t[0]; }
    else if (t === 'U/R') { cls = 'UR'; txt = ''; }
    return `<i class="pip ${cls}" title="{${esc(t)}}">${esc(txt)}</i>`;
  }).join('');
}

function statusText(g) {
  if (g.kind === 'flip') return g.w ? 'Won' : 'Lost';
  if (g.kind === 'stitch') return g.w ? `${g.w} extra ${plural(g.w, 'turn', 'turns')}` : 'No extra turn';
  if (g.kind === 'copy') return 'Copy resolves';
  if (!g.IS) return 'Cast';
  let s = g.n ? `${g.w} ${plural(g.w, 'copy', 'copies')}` : '';
  if (g.sc) s = (s ? s + ' + ' : '') + `${g.sc} storm ${plural(g.sc, 'copy', 'copies')}`;
  const fate = g.back ? (g.fb ? 'exiled (flashback)' : 'back in hand')
    : (g.n ? 'original resolved' : 'resolved') + (g.fb ? ' · exiled (flashback)' : ' · in graveyard');
  return (s ? s + ' · ' : '') + fate;
}
// Tallies shown as chips and in the log, in display order.
const TALLY_TEXT = [
  ['R', v => `${sign(v)} R`], ['U', v => `${sign(v)} U`], ['T', v => `${sign(v)} Treasure`],
  ['dmg', v => `${v} damage`], ['each', v => `${v} to each opponent`], ['mill', v => `mill ${v}`],
  ['poison', v => `${v} poison each`], ['draw', v => `draw ${v}`], ['discard', v => `discard ${v}`],
  ['extra', v => `+${v} extra ${plural(v, 'turn', 'turns')}`],
];
function gainText(gain) {

/* ---------- Odds math ---------- */
// Distribution of Krark outcomes for n triggers with t Thumbs under a choice policy.
// P[b][w]: b = 1 if the spell came back (at least one loss), w = copies (wins).
function krarkDist(n, t, policy) {
  const q = Math.pow(0.5, Math.pow(2, t));   // chance every coin shows the same result (per side)
  const c = 1 - 2 * q;                        // chance the coins split and you choose
  let P = [new Float64Array(n + 1), new Float64Array(n + 1)];
  P[0][0] = 1;
  for (let i = 0; i < n; i++) {
    const N = [new Float64Array(n + 1), new Float64Array(n + 1)];
    const last = i === n - 1;
    for (let b = 0; b < 2; b++) for (let w = 0; w <= i; w++) {
      const p = P[b][w]; if (!p) continue;
      N[b][w + 1] += p * q;
      N[1][w] += p * q;
      if (c > 0) {
        const pick = b ? 'W' : policy === 'copies' ? 'W' : policy === 'first' ? 'L' : (last ? 'L' : 'W');
        if (pick === 'W') N[b][w + 1] += p * c; else N[1][w] += p * c;
      }
    }
    P = N;
  }
  return P;
}
function oddsCost(cost) { const { gen, pips } = parseCost(cost); return gen + pips.filter(p => !p.endsWith('/P')).length; }

function stepper(k, label, val, max) {
  return `<div class="stp"><span class="stp-l">${label}</span><div class="stp-c">
    <button data-a="odds" data-k="${k}" data-d="-1" ${val <= 0 ? 'disabled' : ''} aria-label="Less: ${label}">−</button>
    <output>${val}</output>
    <button data-a="odds" data-k="${k}" data-d="1" ${val >= (max || 20) ? 'disabled' : ''} aria-label="More: ${label}">+</button></div></div>`;
}
function chartSVG(P, n) {
  const W = 340, H = 170, padL = 6, padR = 6, topPad = 18, bot = 24;
  const N = n + 1; let mx = 0; const vals = [];
  for (let w = 0; w <= n; w++) { const a = P[1][w], b = P[0][w]; vals.push([a, b]); mx = Math.max(mx, a + b); }
  if (!mx) mx = 1;
  const bw = (W - padL - padR) / N, gap = Math.min(8, bw * 0.22), scale = (H - topPad - bot) / mx;
  const every = N <= 17 ? 1 : Math.ceil(N / 12);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chance of each number of copies">`;
  s += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${H - bot + 0.5}" y2="${H - bot + 0.5}" stroke-width="1"/>`;
  vals.forEach(([a, b], w) => {
    const x = padL + w * bw + gap / 2, bwid = Math.max(1, bw - gap), base = H - bot;
    const ha = a * scale, hb = b * scale;
    if (ha > 0) s += `<rect class="ch-back" x="${x.toFixed(1)}" y="${(base - ha).toFixed(1)}" width="${bwid.toFixed(1)}" height="${ha.toFixed(1)}" rx="2"/>`;
    if (hb > 0) s += `<rect class="ch-res" x="${x.toFixed(1)}" y="${(base - ha - hb).toFixed(1)}" width="${bwid.toFixed(1)}" height="${hb.toFixed(1)}" rx="2"/>`;
    const tot = a + b;
    if (N <= 11 && tot >= 0.001) s += `<text class="ch-t" x="${(x + bwid / 2).toFixed(1)}" y="${(base - ha - hb - 5).toFixed(1)}" text-anchor="middle">${pct(tot)}</text>`;
    if (w % every === 0 || w === n) s += `<text class="ch-t" x="${(x + bwid / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${w}</text>`;
  });
  return s + '</svg>';
}
function renderOdds() {
  const o = ODDS;
  const m = 1 + o.V + o.P, nF = o.K * m;
  const P = krarkDist(nF, o.T, o.policy);
  let back = 0, res = 0, ew = 0;
  for (let w = 0; w <= nF; w++) { back += P[1][w]; res += P[0][w]; ew += w * (P[0][w] + P[1][w]); }
  const q = Math.pow(0.5, Math.pow(2, o.T));
  const vB = 1 + o.V;
  const card = CARD[o.spell];
  const castGain = (o.B + o.E) * vB + o.S * m;
  const perCopy = o.S * m + 2 * o.Sc + o.mana;
  const cost = Math.max(0, o.cost - (card && card.t === 'C' ? 0 : o.G));
  const net = castGain + ew * perCopy + res * o.mana - cost;
  const needsBlue = card && parseCost(card.c).pips.includes('U');
  const fmt = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(Math.abs(v) < 10 ? 2 : 1).replace(/\.?0+$/, '');
  const surv = k => pct(Math.pow(back, k));
  const casts = back >= 1 ? 'Never stops' : (1 / (1 - back)).toFixed(1);
  const isList = ALL.filter(isIS).sort((a, b) => a.n.localeCompare(b.n));

  $('#screen-odds').innerHTML = `
  <div class="col">
  <section class="block">
    <div class="block-head"><h2>Krark odds</h2><button class="text-btn" data-a="odds-board">Use my board</button></div>
    <div class="stp-grid">
      ${stepper('K', 'Krarks (incl. Sakashima)', o.K)}
      ${stepper('T', "Krark's Thumbs", o.T, 6)}
      ${stepper('V', 'Veyrans', o.V)}
      ${stepper('P', 'Harmonic Prodigies', o.P)}
    </div>
    <p class="per-cast"><span class="lbl">Each instant or sorcery</span><b>${nF}</b> Krark ${plural(nF, 'trigger', 'triggers')}, ${Math.pow(2, o.T)} ${plural(Math.pow(2, o.T), 'coin', 'coins')} per trigger</p>
    ${o.T ? `<div class="seg" role="group" aria-label="Thumb choice rule">${Object.entries(POLICY).map(([k, v]) => `<button data-a="odds-policy" data-v="${k}" aria-pressed="${o.policy === k}">${v.short}</button>`).join('')}</div>
      <p class="desc">${POLICY[o.policy].long}</p>` : `<p class="desc">Without Krark's Thumb every flip is 50/50 and there is nothing to choose.</p>`}
  </section>

  <section class="stats3" aria-label="Results">
    <div class="stat hero"><b>${pct(back)}</b><span>Spell comes back</span></div>
    <div class="stat"><b>${ew.toFixed(2)}</b><span>Copies on average</span></div>
    <div class="stat"><b>${pct(res)}</b><span>Original resolves</span></div>
  </section>

  <section class="block">
    <div class="block-head"><h2>How many copies</h2></div>
    <div class="chart-wrap">${nF ? chartSVG(P, nF) : '<p class="desc" style="padding:20px 6px">Add a Krark to see the spread.</p>'}
      <div class="legend"><span><i style="background:var(--copper)"></i>Back in hand</span><span><i style="background:var(--loss-hi)"></i>Original resolves</span></div></div>
    <dl class="dl">
      <dt>Win one flip (if you want the win)</dt><dd>${pct(1 - q)}</dd>
      <dt>Coins all show a loss</dt><dd>${pct(q)}</dd>
      <dt>Coins split, you choose</dt><dd>${pct(1 - 2 * q)}</dd>
      <dt>At least 1 copy</dt><dd>${pct(1 - P[0][0] - P[1][0])}</dd>
    </dl>
  </section>
  </div>

  <div class="col">
  <section class="block">
    <div class="block-head"><h2>Loop math</h2></div>
    <select class="select" id="odds-spell" aria-label="Spell to loop">
      <option value="custom"${o.spell === 'custom' ? ' selected' : ''}>Custom spell</option>
      ${isList.map(c => `<option value="${esc(c.n)}"${o.spell === c.n ? ' selected' : ''}>${esc(c.n)}</option>`).join('')}
    </select>
    <div class="stp-grid">
      ${stepper('cost', 'Mana it costs', o.cost)}
      ${stepper('mana', 'Mana it makes', o.mana)}
      ${stepper('B', 'Birgi', o.B)}
      ${stepper('E', 'Electro', o.E)}
      ${stepper('S', 'Storm-Kiln Artist', o.S)}
      ${stepper('Sc', 'Tavern Scoundrel', o.Sc)}
      ${stepper('G', 'Geist of Saint Thalia', o.G)}
    </div>
    <dl class="dl">
      <dt>Birgi and Electro on cast</dt><dd>${fmt((o.B + o.E) * vB)}</dd>
      <dt>Storm-Kiln on cast</dt><dd>${fmt(o.S * m)}</dd>
      <dt>Per copy (${ew.toFixed(2)} on average)</dt><dd>${fmt(ew * perCopy)}</dd>
      <dt>Original resolving</dt><dd>${fmt(res * o.mana)}</dd>
      <dt>Cost</dt><dd class="neg">${fmt(-cost)}</dd>
      <dt><b>Net mana per cast</b></dt><dd class="total">${fmt(net)}</dd>
    </dl>
    ${needsBlue ? `<p class="callout">${esc(o.spell)} needs blue. Red mana from Birgi, Electro and rituals can't pay a {U} pip, so count on Treasures or lands for it.</p>` : ''}
    <dl class="dl">
      <dt>Loop lasts 5 casts</dt><dd>${surv(5)}</dd>
      <dt>Loop lasts 10 casts</dt><dd>${surv(10)}</dd>
      <dt>Loop lasts 20 casts</dt><dd>${surv(20)}</dd>
      <dt>Average casts before it stays on the stack</dt><dd>${casts}</dd>
    </dl>
    <p class="desc">Treasure and red mana count the same here. "Mana it makes" applies to the original and every copy, like a ritual.</p>
  </section>

  <details class="rules">
    <summary>Rules this calculator follows</summary>
    <ul>
      <li>Every Krark you control, Sakashima and token copies included, triggers separately when you cast an instant or sorcery.</li>
      <li>Veyran and Harmonic Prodigy each add one more trigger. Krark is a Goblin Wizard, so Prodigy counts. Storm-Kiln Artist and Ashling are Shamans.</li>
      <li>A won flip copies the spell even if an earlier trigger already sent it back to your hand. A lost flip after that does nothing. So copies equal wins, and the spell comes back if you lose at least once.</li>
      <li>Krark's Thumb flips two coins and you keep either one. A second Thumb makes it four coins, a third eight.</li>
      <li>Copies aren't cast. They don't trigger Krark, Birgi, Electro or storm, but they do trigger magecraft (Storm-Kiln Artist, Ashling).</li>
      <li>Tavern Scoundrel makes 2 Treasures for each coin flip you win, from any source. Coins ignored for the Thumb don't count.</li>
      <li>Ashling counts its own triggers each turn: the 2nd deals 2 damage to each opponent and their creatures, the 3rd adds RRRR.</li>
      <li>A spell cast with flashback that loses a flip is exiled, not returned.</li>
      <li>Stitch in Time flips once more for every time it resolves: each copy, plus the original if it resolved. Only those flips give extra turns. A lost one does nothing.</li>
      <li>Copies of Twinned Vision weren't cast from your hand, so each one draws 2.</li>
    </ul>
  </details>
  </div>`;
}

/* ---------- Render all ---------- */
function render() {
  $('#screen-play').hidden = TAB !== 'play';
  $('#screen-odds').hidden = TAB !== 'odds';
  $('#tab-play').setAttribute('aria-pressed', TAB === 'play');
  $('#tab-odds').setAttribute('aria-pressed', TAB === 'odds');
  if (TAB === 'play') { renderBoard(); renderTurn(); renderTray(); renderLog(); }
  else renderOdds();
  renderDock();
  if (SHEET.open === 'cast') renderCastSheet();
  if (SHEET.open === 'settings') renderSettings();
  save();
}

/* ---------- Screen wake lock ---------- */
let wakeLock = null;
async function wake() {
  if (SET.awake !== 'on' || wakeLock || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
  catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

/* ---------- Events ---------- */
const ACTIONS = {
  tab: d => { TAB = d.tab; window.scrollTo(0, 0); render(); },
  eng: d => { checkpoint(); G.eng[d.id] = Math.max(0, cnt(d.id) + Number(d.d)); render(); },
  adj: d => { checkpoint(); const v = G[d.k] + Number(d.d); G[d.k] = d.k === 'life' ? v : Math.max(0, v); render(); },
  flip: () => flipNow(),
  'cast-open': () => openSheet('cast'),
  'settings-open': () => openSheet('settings'),
  'sheet-close': () => closeSheets(),
  recast: () => {
    const ls = G.lastSpell; if (!ls) return;
    if (recastNeedsConfirm(ls) && !ARM_RECAST) {
      ARM_RECAST = true; renderDock();
      clearTimeout(recastTimer); recastTimer = setTimeout(() => { ARM_RECAST = false; renderDock(); }, 3500);
      return;
    }
    ARM_RECAST = false; clearTimeout(recastTimer);
    cast(ls.name, { x:ls.x });
  },
  undo: () => { if (!UNDO.length) return; G = migrate(JSON.parse(UNDO.pop())); LASTVALS = {}; render(); },
  choose: d => choose(d.k),
  'auto-rest': () => { checkpoint(); run(true); render(); },
  real: d => reportReal(Number(d.w)),
  'policy-cycle': () => { const k = Object.keys(POLICY); SET.policy = k[(k.indexOf(SET.policy) + 1) % k.length]; render(); },
  cast: d => { closeSheets(); cast(d.name, { fb:d.fb === '1', x:Number(d.x || 0) }); },
  jeska: d => { SHEET.ask = SHEET.ask === d.name ? null : d.name; if (G.lastSpell && G.lastSpell.name === d.name && G.lastSpell.x) SHEET.x = G.lastSpell.x; renderCastList(); },
  'jeska-x': d => { SHEET.x = Math.max(0, SHEET.x + Number(d.d)); renderCastList(); },
  'copy-last': () => { closeSheets(); copyLast(); },
  pay: d => { SET.pay = d.v; renderCastSheet(); save(); },
  set: d => { SET[d.k] = d.v; if (d.k === 'coins' || d.k === 'choose') run(); if (d.k === 'awake' && d.v === 'on') wake(); render(); },
  'end-turn': () => { closeSheets(); endTurn(); },
  'new-game': () => {
    if (!CONFIRM_NEW) { CONFIRM_NEW = true; renderSettings(); clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { CONFIRM_NEW = false; if (SHEET.open === 'settings') renderSettings(); }, 4000); return; }
    CONFIRM_NEW = false; closeSheets(); newGame();
  },
  odds: d => { const max = d.k === 'T' ? 6 : 20; ODDS[d.k] = Math.min(max, Math.max(0, ODDS[d.k] + Number(d.d))); if (d.k === 'cost' || d.k === 'mana') ODDS.spell = 'custom'; render(); },
  'odds-policy': d => { ODDS.policy = d.v; render(); },
  'odds-board': () => {
    Object.assign(ODDS, { K:cnt('krark'), T:cnt('thumb'), V:cnt('veyran'), P:cnt('prodigy'), B:cnt('birgi'), E:cnt('electro'), S:cnt('kiln'), Sc:cnt('scoundrel'), G:cnt('geist'), policy:SET.policy });
    render();
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  wake();
  if (b.dataset.a !== 'recast' && ARM_RECAST) { ARM_RECAST = false; clearTimeout(recastTimer); }
  const fn = ACTIONS[b.dataset.a]; if (fn) fn(b.dataset, b);
});
document.addEventListener('input', e => { if (e.target.id === 'cast-q') { SHEET.q = e.target.value; renderCastList(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'odds-spell') {
    const v = e.target.value; ODDS.spell = v;
    if (v !== 'custom' && CARD[v]) { ODDS.cost = oddsCost(CARD[v].c); ODDS.mana = (CARD[v].R || 0) + (CARD[v].T || 0); }
    render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET.open) closeSheets(); });

render();
</script>
</body>
</html>
